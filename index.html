<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{text-size-adjust:100%}
body{margin:0;background:#0f1319;color:#e9eef5;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;padding-bottom:66px}
a{color:#69b1ff;text-decoration:none}
.top{position:sticky;top:0;z-index:9;background:#141a22;border-bottom:1px solid #1e2733;padding:10px 14px 8px}
.top .l1{display:flex;justify-content:space-between;align-items:center}
.top .nm{font-size:13px;color:#8b9bb0}
.top .wk{font-size:12.5px;color:#69b1ff;font-weight:600}
.top .goal{margin-top:6px;font-size:12.5px;color:#9fb0c4}
.top .goal b{color:#e9eef5}
.wrap{padding:14px}
.card{background:#161d26;border:1px solid #212b38;border-radius:16px;padding:16px;margin-bottom:12px}
.card.tight{padding:12px 14px}
h2{margin:0 0 6px;font-size:17px}
h3{margin:0 0 8px;font-size:14px;color:#9fb0c4;font-weight:600}
.muted{color:#8698ac;font-size:12.5px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 16px;font-size:14.5px;font-weight:600;background:#243040;color:#dde7f4;font-family:inherit}
.btn.p{background:#2f7cf6;color:#fff}
.btn.g{background:#1f9d6c;color:#fff}
.btn.r{background:#8f3a3f;color:#fff}
.btn.ghost{background:transparent;border:1px solid #2b3645;color:#9fb0c4}
.btn:disabled{opacity:.4}
.btn.big{width:100%;padding:15px;font-size:16px;border-radius:14px}
.step{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #1c242f}
.step:last-child{border-bottom:0}
.num{width:26px;height:26px;border-radius:50%;background:#243040;color:#9fb0c4;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-weight:700}

.step .t{flex:1}
.step .t b{font-size:14.5px;font-weight:600}
.step .t .s{font-size:12px;color:#8698ac;margin-top:1px}
.bar{height:6px;background:#1b232e;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:#2f7cf6;width:0}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:99px;background:#1c2531;color:#93a6bb}
.pill.ok{background:#1f9d6c;color:#fff}
.pill.on{background:#2f7cf6;color:#fff}
.talk{display:flex;gap:11px;align-items:center;padding:11px 12px;background:#151c25;border:1px solid #1e2833;border-radius:13px;margin-bottom:8px}
.talk .no{width:38px;font-size:12.5px;font-weight:700;color:#69b1ff;flex:0 0 auto}
.talk .m{flex:1;min-width:0}
.talk .m .a{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.talk .m .b{font-size:11.8px;color:#8698ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:9px;height:9px;border-radius:50%;background:#2b3645;flex:0 0 auto}
.dot.done{background:#1f9d6c}
.dot.mid{background:#d9a13b}
.chips{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:6px 12px;border-radius:99px;background:#1a222d;color:#93a6bb;border:1px solid #222d3a}
.chip.on{background:#2f7cf6;color:#fff;border-color:#2f7cf6}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid i{aspect-ratio:1;border-radius:5px;background:#1a222d;font-style:normal;font-size:9px;color:#5d6b7d;display:flex;align-items:center;justify-content:center}
.grid i.on{background:#1f9d6c;color:#fff}
.grid i.today{outline:2px solid #69b1ff}
.tab{position:fixed;left:0;right:0;bottom:0;display:flex;background:#141a22;border-top:1px solid #1e2733;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab button{flex:1;border:0;background:transparent;color:#7d8ea3;font:600 11.5px/1.2 inherit;padding:6px 0}
.tab button.on{color:#69b1ff}
.tab button i{display:block;font-size:17px;font-style:normal;margin-bottom:3px}
textarea,input[type=text],input[type=number],input[type=date]{width:100%;background:#0d131b;border:1px solid #253141;color:#e9eef5;border-radius:10px;padding:10px 11px;font:14px/1.5 inherit}
textarea{min-height:64px;resize:vertical}
p.tx{font-size:16px;line-height:1.9;margin:0 0 15px;color:#dde6f1}
p.tx.hl{background:#22331f;border-radius:8px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #1e2833;font-size:13.5px}
.kv:last-child{border-bottom:0}
.banner{background:#17251b;border:1px solid #2b6b45;color:#a8e6c1;padding:11px 13px;border-radius:12px;font-size:13px;margin-bottom:12px}
.warn{background:#2a2318;border-color:#6b5a2b;color:#e6d3a8}
.hide{display:none}
.big{font-size:22px;font-weight:800;letter-spacing:-.3px}
</style>

<script>
"use strict";
var BOOK = { id: "b2", total: 18 };
var LSK = "tedv2_" + BOOK.id;
var TALKS = [{"cn": "亲历死亡，教会了我什么是生活", "en": "What Almost Dying Taught Me about Living", "o": "What almost dying taught me about living", "s": "Suleika Jaouad", "dur": "17′13″", "w": 2296, "tag": "人生", "lvl": "难", "note": "", "url": "https://www.ted.com/talks/suleika_jaouad_what_almost_dying_taught_me_about_living"}, {"cn": "一个最简单的方式戒掉坏习惯", "en": "A Simple Way to Break a Bad Habit", "o": "A simple way to break a bad habit", "s": "Judson Brewer ", "dur": "9′14″", "w": 1509, "tag": "行为", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/judson_brewer_a_simple_way_to_break_a_bad_habit"}, {"cn": "怎样走出负面情绪", "en": "A Simple Trick to Improve Positive Thinking", "o": "A simple trick to improve positive thinking", "s": "", "dur": "10′00″", "w": 1736, "tag": "心理", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/alison_ledgerwood_a_simple_trick_to_improve_positive_thinking"}, {"cn": "如何摆脱\"无效努力\"？", "en": "How to Get Better at the Things You Care About", "o": "How to get better at the things you care about", "s": "Eduardo Briceño", "dur": "11′12″", "w": 1913, "tag": "学习", "lvl": "难", "note": "", "url": "https://www.ted.com/talks/eduardo_briceno_how_to_get_better_at_the_things_you_care_about"}, {"cn": "运动改变你的大脑", "en": "The Brain-Changing Benefits of Exercise", "o": "The brain-changing benefits of exercise", "s": "Wendy Suzuki", "dur": "12′53″", "w": 1938, "tag": "健康", "lvl": "难", "note": "", "url": "https://www.ted.com/talks/wendy_suzuki_the_brain_changing_benefits_of_exercise"}, {"cn": "微笑是你的超能力", "en": "The Hidden Power of Smiling", "o": "The hidden power of smiling", "s": "", "dur": "7′09″", "w": 1022, "tag": "心理", "lvl": "易", "note": "", "url": "https://www.ted.com/talks/ron_gutman_the_hidden_power_of_smiling"}, {"cn": "接受焦虑的自己", "en": "What's Normal Anxiety — and What's an Anxiety Disorder", "o": "What's normal anxiety -- and what's an anxiety disorder?", "s": "", "dur": "5′10″", "w": 850, "tag": "心理", "lvl": "易", "note": "", "url": "https://www.ted.com/talks/jen_gunter_what_s_normal_anxiety_and_what_s_an_anxiety_disorder"}, {"cn": "激发学习兴趣的三条黄金法则", "en": "3 Rules to Spark Learning", "o": "3 rules to spark learning", "s": "", "dur": "6′15″", "w": 879, "tag": "教育", "lvl": "易", "note": "", "url": "https://www.ted.com/talks/ramsey_musallam_3_rules_to_spark_learning"}, {"cn": "我们为什么要工作", "en": "The Way We Think about Work is Broken", "o": "The way we think about work is broken", "s": "Barry Schwartz", "dur": "7′52″", "w": 1175, "tag": "职场", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/barry_schwartz_the_way_we_think_about_work_is_broken"}, {"cn": "再艰难，你也要跳出舒适区去生活", "en": "Living Beyond Limits", "o": "Living beyond limits", "s": "", "dur": "9′35″", "w": 1225, "tag": "勇气", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/amy_purdy_living_beyond_limits"}, {"cn": "疫情教会我们的几件事：关于工作、生活和平衡", "en": "Lessons the Pandemic Taught Us about Work, Life and Balance", "o": "4 lessons the pandemic taught us about work, life and balance", "s": "Patty McCord", "dur": "7′40″", "w": 1360, "tag": "职场", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/patty_mccord_4_lessons_the_pandemic_taught_us_about_work_life_and_balance"}, {"cn": "再平淡无聊的生活，也可以变得有趣起来", "en": "The Agony of Trying to Unsubscribe", "o": "The agony of trying to unsubscribe", "s": "", "dur": "7′31″", "w": 972, "tag": "幽默", "lvl": "易", "note": "", "url": "https://www.ted.com/talks/james_veitch_the_agony_of_trying_to_unsubscribe"}, {"cn": "我们如何毫无畏惧地一起直面未来", "en": "How We Can Face the Future without Fear, Together", "o": "How we can face the future without fear, together", "s": "Rabbi Lord Jonathan Sacks", "dur": "12′26″", "w": 1516, "tag": "社会", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/rabbi_lord_jonathan_sacks_how_we_can_face_the_future_without_fear_together"}, {"cn": "拖延症人群的内心世界", "en": "Inside the Mind of a Master Procrastinator", "o": "Inside the mind of a master procrastinator", "s": "", "dur": "13′54″", "w": 2277, "tag": "行为", "lvl": "难", "note": "", "url": "https://www.ted.com/talks/tim_urban_inside_the_mind_of_a_master_procrastinator"}, {"cn": "越努力，越幸运", "en": "The Little Risks You Can Take to Increase Your Luck", "o": "The little risks you can take to increase your luck", "s": "", "dur": "11′29″", "w": 1942, "tag": "心态", "lvl": "难", "note": "", "url": "https://www.ted.com/talks/tina_seelig_the_little_risks_you_can_take_to_increase_your_luck"}, {"cn": "一切只需10分钟的专注", "en": "All It Takes Is 10 Mindful Minutes", "o": "All it takes is 10 mindful minutes", "s": "Andy Puddicombe", "dur": "9′07″", "w": 1546, "tag": "正念", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/andy_puddicombe_all_it_takes_is_10_mindful_minutes"}, {"cn": "如何才能幸福", "en": "What Makes a Happy Life?", "o": "What makes a good life? Lessons from the longest study on happiness", "s": "", "dur": "12′37″", "w": 1714, "tag": "心理", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/robert_waldinger_what_makes_a_good_life_lessons_from_the_longest_study_on_happiness"}, {"cn": "我们能摆脱爱情吗", "en": "Can We Choose to Fall out of Love?", "o": "Can we choose to fall out of love?", "s": "Dessa", "dur": "11′30″", "w": 1753, "tag": "关系", "lvl": "中", "note": "", "url": "https://www.ted.com/talks/dessa_can_we_choose_to_fall_out_of_love_sep_2019"}];            // 38 条：cn/en/o/s/dur/w/tag/lvl/note/url
var DW = [1,2,3,4,5,6,8,9,10,11]; // 精读周
var SW = [3,4,5,6,8,9,10,11];     // 跟读周
var SCW = [2,3,4,5,6,8,9,10,11];  // 泛读周

function todayISO(d){ d = d || new Date(); var m = d.getMonth()+1, x = d.getDate();
  return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x; }
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function addD(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function diffD(a,b){ return Math.round((parseISO(b)-parseISO(a))/86400000); }
function dowCN(i){ return ["周日","周一","周二","周三","周四","周五","周六"][i]; }
function fmt(s){ s = Math.max(0, s|0); var m = Math.floor(s/60); return m+"′"+((s%60)<10?"0":"")+(s%60)+"″"; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

var DEF = function(){ return { v:2, start: todayISO(), names:{}, read:{}, speak:{}, cards:[], logs:{},
  cfg:{ dailyMin:15, deepMin:40, recDaily:30, recDeep:60, fontpx:16 } }; };
var S = load();
function load(){
  try { var r = JSON.parse(localStorage.getItem(LSK)); if (r && r.v === 2) { var d = DEF();
    for (var k in d) if (!(k in r)) r[k] = d[k];
    for (var c in d.cfg) if (!(c in r.cfg)) r.cfg[c] = d.cfg[c]; return r; } } catch(e){}
  return DEF();
}
function save(){ try { localStorage.setItem(LSK, JSON.stringify(S)); } catch(e){} }
function log(d){ if (!S.logs[d]) S.logs[d] = { sec:0, rec:0, done:false }; return S.logs[d]; }

/* 计划：每篇恰好用一次 */
var PLAN = (function(){
  var n = 1, deep=[], sh=[], sc=[];
  DW.forEach(function(w){ if (n<=BOOK.total) deep.push({w:w,talk:n++}); });
  SW.forEach(function(w){ if (n<=BOOK.total) sh.push({w:w,talk:n++}); });
  SCW.forEach(function(w){ if (n<=BOOK.total) sc.push({w:w,talk:n++}); });
  return {deep:deep, sh:sh, sc:sc};
})();
function allPlan(){ return PLAN.deep.concat(PLAN.sh, PLAN.sc); }
function roleOf(t){ for (var i=0;i<PLAN.deep.length;i++) if (PLAN.deep[i].talk===t) return "deep";
  for (var j=0;j<PLAN.sh.length;j++) if (PLAN.sh[j].talk===t) return "shadow";
  return "scan"; }
function weekOf(t){ var a = allPlan(); for (var i=0;i<a.length;i++) if (a[i].talk===t) return a[i].w; return 0; }
function roleCN(r){ return r==="deep" ? "精读" : r==="shadow" ? "跟读" : "泛读"; }
function curWeek(){ var d = diffD(S.start, todayISO()); return d < 0 ? 0 : Math.min(12, Math.floor(d/7)+1); }
function deepOfWeek(w){ for (var i=0;i<PLAN.deep.length;i++) if (PLAN.deep[i].w===w) return PLAN.deep[i].talk; return 0; }
function talksOfWeek(w){ var o=[]; allPlan().forEach(function(x){ if (x.w===w) o.push(x.talk); });
  o.sort(function(a,b){ var r={deep:0,shadow:1,scan:2}; return r[roleOf(a)]-r[roleOf(b)] || a-b; }); return o; }
function T(t){ return TALKS[t-1] || {}; }
function nameOf(t){ return S.names[t] || T(t).cn || ("第 "+t+" 篇"); }
function cardOf(t){ for (var i=S.cards.length-1;i>=0;i--) if (S.cards[i].talk===t) return S.cards[i]; return null; }
function doneOf(t){ return !!(S.read[t] && (S.speak[t]||0) >= 60 && cardOf(t)); }
function isDeepDay(d){ return parseISO(d).getDay() === 6; }
function needSec(d){ return isDeepDay(d) ? S.cfg.deepMin*60 : S.cfg.dailyMin*60; }
function needRec(d){ return isDeepDay(d) ? S.cfg.recDeep : S.cfg.recDaily; }
function streak(){ var n=0, d=todayISO(); if (!(S.logs[d] && S.logs[d].done)) d = todayISO(addD(parseISO(d),-1));
  while (S.logs[d] && S.logs[d].done) { n++; d = todayISO(addD(parseISO(d),-1)); } return n; }
function totalMin(){ var s=0; for (var k in S.logs) s += (S.logs[k].sec||0); return Math.round(s/60); }
function deepDone(){ var n=0; PLAN.deep.forEach(function(x){ if (doneOf(x.talk)) n++; }); return n; }

/* ---------- 计时（只在前台累计） ---------- */
var timer = { on:false, iv:null };
function tStart(){ if (timer.on) return; timer.on = true;
  timer.iv = setInterval(function(){ if (document.visibilityState !== "visible") return;
    log(todayISO()).sec++; save(); paintTimer(); }, 1000); render(); }
function tStop(){ timer.on = false; clearInterval(timer.iv); timer.iv = null; render(); }
function paintTimer(){ var e = document.getElementById("tSec"); if (e) e.textContent = fmt(log(todayISO()).sec);
  var b = document.getElementById("tBar"); if (b) b.style.width = Math.min(100, log(todayISO()).sec/needSec(todayISO())*100) + "%"; }

/* ---------- 录音（只存时长） ---------- */
var rec = { mr:null, t0:0, iv:null, talk:0 };
function rStart(talk){
  if (!navigator.mediaDevices || !window.MediaRecorder) { rFail(); return; }
  rec.talk = talk || 0;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    rec.mr = new MediaRecorder(st); rec.t0 = Date.now();
    rec.mr.ondataavailable = function(){};
    rec.mr.onstop = function(){
      var sec = Math.round((Date.now()-rec.t0)/1000);
      st.getTracks().forEach(function(x){ x.stop(); });
      var L = log(todayISO()); L.rec = Math.max(L.rec||0, sec);
      if (rec.talk) S.speak[rec.talk] = Math.max(S.speak[rec.talk]||0, sec);
      save(); render();
    };
    rec.mr.start();
    rec.iv = setInterval(function(){ var e = document.getElementById("rSec");
      if (e) e.textContent = fmt(Math.round((Date.now()-rec.t0)/1000)); }, 500);
    render();
  }).catch(function(){ rFail(); });
}
function rStop(){ if (rec.iv) { clearInterval(rec.iv); rec.iv = null; }
  if (rec.mr && rec.mr.state !== "inactive") rec.mr.stop(); }
function rFail(){ alert("浏览器不允许录音。改用手动勾：「我口头复述过了」。");
  var t = rec.talk || deepOfWeek(curWeek()); if (t) { S.speak[t] = Math.max(S.speak[t]||0, 60); save(); }
  log(todayISO()).rec = Math.max(log(todayISO()).rec||0, needRec(todayISO())); save(); render(); }

/* ---------- 打卡 ---------- */
function blockMsg(){
  var d = todayISO(), L = log(d);
  if (L.sec < needSec(d)) return "还差 "+fmt(needSec(d)-L.sec)+" 学习时间";
  if ((L.rec||0) < needRec(d)) return "还差开口 "+needRec(d)+" 秒";
  if (isDeepDay(d) && curWeek()>=1) { var t = deepOfWeek(curWeek()); if (t && !cardOf(t)) return "还差记 3 行卡"; }
  return "";
}
function checkin(){ var m = blockMsg(); if (m) { alert(m); return; }
  log(todayISO()).done = true; save(); render(); alert("今天完成 ✅ 连续 "+streak()+" 天"); }

/* ---------- 路由 ---------- */
var route = { t:"today", sub:null };
var TABS = [["today","今天","◎"],["talks","篇目","☰"],["plan","计划","▤"],["prog","进度","◔"]];
function go(h){ location.hash = h; }
function parse(){ var h = (location.hash||"#today").replace("#",""), p = h.split("/");
  var ok = TABS.some(function(x){ return x[0]===p[0]; }) || p[0]==="talk" || p[0]==="text" || p[0]==="set";
  route.t = ok ? p[0] : "today"; route.sub = p[1] || null; }

/* ---------- 原文 ---------- */
var TX = null, TXE = "";
function loadTX(cb){
  if (TX) { cb && cb(); return; }
  fetch("talks_" + BOOK.id.slice(1) + ".json", {cache:"no-cache"})
    .then(function(r){ if (!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(j){ TX = j; cb && cb(); })
    .catch(function(e){ TXE = e.message; render(); });
}
function paras(txt){
  var s = String(txt).replace(/\s+/g," ").match(/[^.!?]+[.!?]+["')\]]?|[^.!?]+$/g) || [txt], out = [], buf = "";
  for (var i=0;i<s.length;i++){ buf += (buf?" ":"") + s[i].trim();
    if (buf.length > 210 || i === s.length-1) { out.push(buf.trim()); buf = ""; } }
  return out;
}

/* ---------- 视图 ---------- */
function vToday(){
  var d = todayISO(), L = log(d), w = curWeek(), deep = isDeepDay(d);
  var dt = w>=1 && w<=12 ? deepOfWeek(w) : 0;
  var weekList = w>=1 && w<=12 ? talksOfWeek(w) : [];
  var h = "";
  if (L.done) h += '<div class="banner">今天已完成 ✅ 连续 '+streak()+' 天</div>';
  if (w > 12) h += '<div class="banner warn">12 周跑完了。收官：写一段 3 分钟 mini TED。</div>';
  if (w < 1) h += '<div class="banner warn">计划未开始（起始日 '+S.start+'），去设置里调。</div>';

  /* 一件事 */
  h += '<div class="card">';
  if (deep && dt) {
    h += '<h3>今天是精读日（周六）</h3><h2>精读第 '+dt+' 篇 · '+esc(nameOf(dt))+'</h2>';
    h += '<div class="muted" style="margin:4px 0 12px">'+esc(T(dt).en||"")+' · '+esc(T(dt).s||"")+' · '+esc(T(dt).dur||"")+' · '+(T(dt).w||0)+' 词</div>';
  } else if (weekList.length) {
    var ft = weekList[weekList.length-1];
    h += '<h3>今天：跟读 30 秒</h3><h2>开口说 '+esc(nameOf(ft))+'</h2>';
    h += '<div class="muted" style="margin:4px 0 12px">本周精读：第 '+(dt||"-")+' 篇 '+esc(dt?nameOf(dt):"")+'（周六做）</div>';
  } else {
    h += '<h3>今天</h3><h2>轻练 15 分钟</h2><div class="muted" style="margin:4px 0 12px">自由选一篇跟读</div>';
  }
  /* 三步 */
  var tgt = deep && dt ? dt : (weekList.length ? weekList[weekList.length-1] : 0);
  var readT = dt || tgt;
  var r1 = readT ? !!S.read[readT] : false, r2 = tgt ? (S.speak[tgt]||0) >= 60 : false;
  var r3 = tgt ? !!cardOf(tgt) : false;
  h += '<div class="step"><div class="num'+(r1?" done":"")+'">1</div><div class="t"><b>读原文</b><div class="s">'+fmt(needSec(d))+' 内读完整篇，不求全懂</div></div>'
     + (tgt ? '<a class="btn" href="#text/'+readT+'">'+((TX&&TX[readT])?"重读":"打开")+'</a>' : '') + '</div>';
  h += '<div class="step"><div class="num'+(r2?" done":"")+'">2</div><div class="t"><b>开口说 '+needRec(d)+' 秒</b><div class="s">不写稿，直接复述 3 个要点（本篇累计 60 秒算完成）</div></div>'
     + '<button class="btn" onclick="rStart('+tgt+')">录音</button></div>';
  h += '<div class="step"><div class="num'+(r3?" done":"")+'">3</div><div class="t"><b>记 3 行</b><div class="s">一句金句 / 一个结构 / 3 个词</div></div>'
     + (tgt ? '<a class="btn" href="#talk/'+tgt+'">去写</a>' : '') + '</div>';
  /* 状态 + 完成 */
  h += '<div class="row" style="margin-top:14px"><span class="pill" id="tSec2">⏱ <b id="tSec">'+fmt(L.sec)+'</b></span>'
     + '<span class="pill">🎙 <b id="rSec">'+fmt(L.rec||0)+'</b></span>'
     + '<button class="btn '+(timer.on?"r":"ghost")+'" onclick="'+(timer.on?"tStop()":"tStart()")+'">'+(timer.on?"暂停计时":"开始计时")+'</button></div>';
  h += '<div class="bar"><i id="tBar" style="width:'+Math.min(100, L.sec/needSec(d)*100)+'%"></i></div>';
  var bm = blockMsg();
  h += '<div style="margin-top:12px"><button class="btn g big" onclick="checkin()" '+(L.done||bm?"disabled":"")+'>'
     + (L.done ? "今天已完成" : (bm ? bm : "完成今天")) + '</button></div>';
  h += '</div>';

  /* 本周清单 */
  if (weekList.length) {
    h += '<div class="card tight"><h3>本周（第 '+w+' 周）</h3>';
    weekList.forEach(function(t){
      var st = doneOf(t) ? "done" : (S.read[t]||S.speak[t]) ? "mid" : "";
      h += '<div class="talk" onclick="go(\'talk/'+t+'\')"><div class="no">P'+t+'</div><div class="m"><div class="a">'+esc(nameOf(t))+'</div>'
         + '<div class="b">'+roleCN(roleOf(t))+' · '+esc(T(t).dur||"")+' · '+(T(t).w||0)+'词</div></div><div class="dot '+st+'"></div></div>';
    });
    h += '</div>';
  }
  return h;
}

function vTalks(){
  var f = route.sub || "all";
  var h = '<div class="chips">';
  [["all","全部 "+BOOK.total],["deep","精读 "+PLAN.deep.length],["shadow","跟读 "+PLAN.sh.length],["scan","泛读 "+PLAN.sc.length],["doing","进行中"]].forEach(function(c){
    h += '<span class="chip '+(f===c[0]?"on":"")+'" onclick="go(\'talks/'+c[0]+'\')">'+c[1]+'</span>';
  });
  h += '</div>';
  for (var t=1;t<=BOOK.total;t++){
    var r = roleOf(t);
    if (f==="deep" && r!=="deep") continue;
    if (f==="shadow" && r!=="shadow") continue;
    if (f==="scan" && r!=="scan") continue;
    if (f==="doing" && !((S.read[t]&&!doneOf(t)) || (S.speak[t]&&!doneOf(t)))) continue;
    var st = doneOf(t) ? "done" : (S.read[t]||S.speak[t]) ? "mid" : "";
    h += '<div class="talk" onclick="go(\'talk/'+t+'\')"><div class="no">P'+t+'</div><div class="m">'
       + '<div class="a">'+esc(nameOf(t))+'</div>'
       + '<div class="b">'+esc(T(t).en||"")+' · '+esc(T(t).dur||"")+' · '+(T(t).w||0)+'词 · '+esc(T(t).lvl||"")+'</div></div>'
       + '<div class="dot '+st+'"></div></div>';
  }
  return h;
}

function vTalk(t){
  var d = T(t), r = roleOf(t), cr = cardOf(t);
  var h = '<div class="card">';
  h += '<h3>第 '+t+' 篇 · '+roleCN(r)+' · 第 '+weekOf(t)+' 周</h3>';
  h += '<h2>'+esc(nameOf(t))+'</h2>';
  h += '<div class="muted" style="margin:4px 0 0">'+esc(d.en||"")+'<br>'+esc(d.s||"")+' · '+esc(d.dur||"")+' · '+(d.w||0)+' 词 · '+esc(d.tag||"")+' · 难度'+esc(d.lvl||"")+'</div>';
  if (d.note) h += '<div class="banner warn" style="margin-top:10px">'+esc(d.note)+'</div>';
  h += '</div>';

  h += '<div class="card"><h3>这篇要拿到什么</h3>'
     + '<div class="muted">① 不看稿说清 3 个要点（60 秒）<br>② 抄 1 个能复用的结构<br>③ 记 3 个能用的表达</div></div>';

  h += '<div class="card"><h3>三步</h3>';
  h += '<div class="step"><div class="num'+(S.read[t]?" done":"")+'">1</div><div class="t"><b>读原文</b><div class="s">官方英文全稿，约 1.5–3 分钟读完 200 词</div></div><a class="btn" href="#text/'+t+'">'+(S.read[t]?"重读":"打开")+'</a></div>';
  h += '<div class="step"><div class="num'+((S.speak[t]||0)>=60?" done":"")+'">2</div><div class="t"><b>开口说</b><div class="s">已录 '+(S.speak[t]||0)+' 秒 / 目标 60 秒（当前 <b id="rSec">'+fmt(S.speak[t]||0)+'</b>）</div></div><button class="btn" onclick="rStart('+t+')">录音</button></div>';
  h += '<div class="step"><div class="num'+(cr?" done":"")+'">3</div><div class="t"><b>记 3 行</b><div class="s">'+(cr?"已记于 "+cr.date:"金句 · 结构 · 3 个词")+'</div></div></div>';
  h += '</div>';

  h += '<div class="card"><h3>写下这 3 行</h3>';
  h += '<div class="muted" style="margin-bottom:5px">1. 一句金句（可直接引用）</div><textarea id="c1">'+esc(cr?cr.quote:"")+'</textarea>';
  h += '<div class="muted" style="margin:10px 0 5px">2. 一个结构（如 问题→旧办法失效→新视角→行动）</div><textarea id="c2">'+esc(cr?cr.struct:"")+'</textarea>';
  h += '<div class="muted" style="margin:10px 0 5px">3. 三个表达的例句</div><textarea id="c3">'+esc(cr?cr.words:"")+'</textarea>';
  h += '<div class="row" style="margin-top:12px"><button class="btn p" onclick="saveCard('+t+')">保存</button>'
     + '<button class="btn ghost" onclick="ren('+t+')">改书名</button>'
     + (d.url ? '<a class="btn ghost" href="'+esc(d.url)+'" target="_blank" rel="noopener">TED 原页</a>' : '')
     + '</div></div>';
  if (doneOf(t)) h += '<div class="banner">这篇已完成 ✅</div>';
  h += '<div class="row" style="margin:0 0 20px"><a class="btn ghost" href="#talks">返回篇目</a></div>';
  return h;
}

function vText(t){
  var d = T(t);
  var h = '<div class="card tight"><div class="row" style="justify-content:space-between">'
        + '<a class="btn ghost" href="#talk/'+t+'">← 第 '+t+' 篇</a>'
        + '<span class="pill">第 '+t+' 篇</span></div>'
        + '<h2 style="margin-top:10px">'+esc(nameOf(t))+'</h2>'
        + '<div class="muted">'+esc(d.en||"")+' · '+esc(d.s||"")+' · '+esc(d.dur||"")+' · '+(d.w||0)+' 词</div></div>';
  if (TXE) h += '<div class="card"><div class="muted">原文载入失败：'+esc(TXE)+'</div></div>';
  if (!TX) return h + '<div class="card"><div class="muted">正在载入原文…</div></div>';
  h += '<div class="card tight"><div class="row"><span class="muted">读完点右下角三步的第 2 步</span>'
     + '<span style="flex:1"></span><button class="btn ghost" onclick="fz(-1)">A−</button><button class="btn ghost" onclick="fz(1)">A+</button></div></div>';
  h += '<div class="card" style="font-size:'+(S.cfg.fontpx||16)+'px">';
  paras(TX[t].text).forEach(function(p){ h += '<p class="tx" onclick="this.classList.toggle(\'hl\')">'+esc(p)+'</p>'; });
  h += '</div>';
  h += '<div class="row" style="margin-bottom:24px"><button class="btn p big" onclick="markRead('+t+')">读完了 · 去说 60 秒</button></div>';
  return h;
}

function vPlan(){
  var cw = curWeek();
  var h = '<div class="card tight"><h3>节奏</h3><div class="muted">每周 1 篇精读（周六）+ 1 篇跟读 + 1 篇泛读。第 7 周回炉，第 12 周收官。</div></div>';
  for (var w=1; w<=12; w++){
    var list = talksOfWeek(w);
    var hd = w===1 ? "跑通流程" : w===7 ? "回炉：前 6 篇合成 90 秒" : w===12 ? "收官：3 分钟 mini TED" : "";
    h += '<div class="card tight" style="'+(w===cw?"border-color:#2f7cf6":"")+'">'
       + '<div class="row" style="justify-content:space-between"><b>第 '+w+' 周'+(w===cw?' <span class="pill on">本周</span>':'')+'</b>'
       + '<span class="muted">'+(hd||(list.length?list.length+" 篇":""))+'</span></div>';
    if (list.length && w!==7 && w!==12) {
      h += '<div class="muted" style="margin-top:6px">';
      h += list.map(function(t){ return roleCN(roleOf(t))+" P"+t; }).join(" · ");
      h += '</div>';
    } else if (hd) h += '<div class="muted" style="margin-top:6px">'+hd+'</div>';
    h += '</div>';
  }
  return h;
}

function vProg(){
  var done = 0; for (var t=1;t<=BOOK.total;t++) if (doneOf(t)) done++;
  var on = 0; for (var k in S.logs) if (S.logs[k].done) on++;
  var h = '<div class="card"><h3>总览</h3>';
  h += '<div class="kv"><span>连续天数</span><b>'+streak()+' 天</b></div>';
  h += '<div class="kv"><span>完成篇数</span><b>'+done+' / '+BOOK.total+'</b></div>';
  h += '<div class="kv"><span>其中精读</span><b>'+deepDone()+' / '+PLAN.deep.length+'</b></div>';
  h += '<div class="kv"><span>累计学习</span><b>'+totalMin()+' 分钟</b></div>';
  h += '<div class="kv"><span>打卡天数</span><b>'+on+' 天</b></div>';
  h += '<div class="kv"><span>3 行卡</span><b>'+S.cards.length+' 张</b></div></div>';
  h += '<div class="card"><h3>12 周热格</h3><div class="grid">';
  for (var i=0;i<84;i++){ var d = todayISO(addD(parseISO(S.start), i));
    var cls = "grid i" + ((S.logs[d]&&S.logs[d].done)?" on":"") + (d===todayISO()?" today":"");
    h += '<i class="'+cls+'">'+parseISO(d).getDate()+'</i>'; }
  h += '</div></div>';
  if (S.cards.length) {
    h += '<div class="card"><h3>最近的卡</h3>';
    for (var j=S.cards.length-1; j>=Math.max(0,S.cards.length-6); j--){ var c = S.cards[j];
      h += '<div class="kv"><span>P'+c.talk+' '+esc(nameOf(c.talk))+'</span><b style="font-weight:400;text-align:right;max-width:60%">'+esc((c.quote||"").slice(0,26))+'</b></div>'; }
    h += '</div>';
  }
  h += '<div class="row" style="margin-bottom:20px"><a class="btn ghost" href="#set">设置</a></div>';
  return h;
}

function vSet(){
  var h = '<div class="card"><h3>目标门槛</h3>'
   + '<div class="muted" style="margin-bottom:5px">平时每天最少学（分钟）</div><input type="number" id="k1" value="'+S.cfg.dailyMin+'">'
   + '<div class="muted" style="margin:10px 0 5px">周六精读最少学（分钟）</div><input type="number" id="k2" value="'+S.cfg.deepMin+'">'
   + '<div class="muted" style="margin:10px 0 5px">平时开口最少（秒）</div><input type="number" id="k3" value="'+S.cfg.recDaily+'">'
   + '<div class="muted" style="margin:10px 0 5px">周六开口最少（秒）</div><input type="number" id="k4" value="'+S.cfg.recDeep+'">'
   + '<div class="muted" style="margin:10px 0 5px">起始日</div><input type="date" id="k5" value="'+S.start+'">'
   + '<div style="margin-top:14px"><button class="btn p big" onclick="saveCfg()">保存</button></div></div>';
  h += '<div class="card"><h3>数据</h3><div class="row"><button class="btn ghost" onclick="exp()">导出备份</button>'
   + '<button class="btn r" onclick="wipe()">清空</button></div>'
   + '<div class="muted" style="margin-top:8px">只存在本机浏览器。换设备或清缓存前先导出。</div></div>';
  h += '<div class="row" style="margin-bottom:20px"><a class="btn ghost" href="#today">返回</a></div>';
  return h;
}

/* ---------- 动作 ---------- */
function saveCard(t){
  var a = document.getElementById("c1").value.trim(),
      b = document.getElementById("c2").value.trim(),
      c = document.getElementById("c3").value.trim();
  if (!a && !b && !c) { alert("至少写一行"); return; }
  for (var i=S.cards.length-1;i>=0;i--) if (S.cards[i].talk===t) S.cards.splice(i,1);
  S.cards.push({date: todayISO(), talk: t, quote: a, struct: b, words: c});
  save(); alert("已保存 ✅"); render();
}
function markRead(t){ S.read[t] = 1; save(); go("talk/"+t); }
function ren(t){ var v = prompt("书名（照书上目录）", nameOf(t)); if (v!==null) { S.names[t] = v.trim(); save(); render(); } }
function fz(d){ S.cfg.fontpx = Math.min(24, Math.max(13, (S.cfg.fontpx||16)+d)); save(); render(); }
function saveCfg(){
  S.cfg.dailyMin = +document.getElementById("k1").value || 15;
  S.cfg.deepMin = +document.getElementById("k2").value || 40;
  S.cfg.recDaily = +document.getElementById("k3").value || 30;
  S.cfg.recDeep = +document.getElementById("k4").value || 60;
  var d = document.getElementById("k5").value; if (d) S.start = d;
  save(); alert("已保存"); go("today");
}
function exp(){ var b = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(b);
  a.download = "ted_"+BOOK.id+"_"+todayISO()+".json"; a.click(); }
function wipe(){ if (!confirm("清空本册全部记录？不可恢复。")) return; S = DEF(); save(); render(); }

/* ---------- 渲染 ---------- */
function render(){
  var d = new Date(), w = curWeek();
  document.getElementById("nm").textContent = BOOK.id === "b1" ? "TED 精读计划 1" : "TED 精读计划 2";
  document.getElementById("wk").textContent = (w<1 ? "未开始" : w>12 ? "12 周完成" : "第 "+w+"/12 周") + " · 连续 "+streak()+" 天";
  document.getElementById("goal").innerHTML = "目标：<b>12 周精读 "+PLAN.deep.length+" 篇</b> · 每天 <b>"+S.cfg.dailyMin+" 分钟</b> · 每天开口 <b>"+S.cfg.recDaily+" 秒</b> · 已完成 <b>"+deepDone()+"/"+PLAN.deep.length+"</b>";
  var h = "";
  if (route.t==="today") h = vToday();
  else if (route.t==="talks") h = vTalks();
  else if (route.t==="talk") h = vTalk(+route.sub);
  else if (route.t==="text") h = vText(+route.sub);
  else if (route.t==="plan") h = vPlan();
  else if (route.t==="prog") h = vProg();
  else if (route.t==="set") h = vSet();
  document.getElementById("main").innerHTML = h;
  var tb = "";
  TABS.forEach(function(x){
    var on = route.t===x[0] || (x[0]==="talks" && (route.t==="talk"||route.t==="text"));
    tb += '<button class="'+(on?"on":"")+'" onclick="go(\''+x[0]+'\')"><i>'+x[2]+'</i>'+x[1]+'</button>';
  });
  document.getElementById("tab").innerHTML = tb;
  window.scrollTo(0,0);
}

window.addEventListener("hashchange", function(){ parse(); render(); });
parse(); render(); loadTX(function(){ render(); });
if (!location.hash) location.replace("#today");
</script>
</body>
</html>
